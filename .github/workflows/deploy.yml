name: Deploy to GitHub Pages (no external actions)

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch's name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this workflow to push to the repository (gh-pages branch)
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Node.js 20 (via NodeSource)
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node -v
          npm -v

      - name: Clone repository
        run: |
          git clone --depth=1 https://github.com/${{ github.repository }} repo

      - name: Install dependencies
        working-directory: repo
        run: npm ci

      - name: Build with Astro
        working-directory: repo
        env:
          # 设置 GitHub Pages 环境变量
          SPACESHIP_SITE: https://xujinhuan675-cloud.github.io
          SPACESHIP_BASE: /AstrOb/
          SPACESHIP_AUTHOR: My Vault
        run: npm run build:github

      - name: Publish to gh-pages branch
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          PAGES_DIR="dist"
          if [ ! -d "$PAGES_DIR" ]; then
            echo "Build output directory '$PAGES_DIR' not found" >&2
            exit 1
          fi

          DEPLOY_DIR="../deploy"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          cp -R "$PAGES_DIR"/* "$DEPLOY_DIR"/

          cd "$DEPLOY_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy to GitHub Pages: $GITHUB_SHA"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages

      - name: Final note
        run: |
          echo "Pushed 'dist' to 'gh-pages' branch. Ensure Settings > Pages uses 'gh-pages / root'."
